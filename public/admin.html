<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Szyb – panel autora</title>
<link rel="stylesheet" href="/fonts.css">
<style>
  :root { color-scheme: dark; --bg: #0e0b1c; --panel: #17122e; --line: #3a3360; --ink: #f6f1d8; --muted: #9a93c2; --accent: #ffcc1a; --accent2: #34d8c2; --bad: #ff4d63; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Mono", monospace; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font: 700 30px "Pixelify Sans", monospace; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  h2 { font: 600 14px "IBM Plex Mono", monospace; letter-spacing: 3px; color: var(--muted); margin: 30px 0 10px; border-bottom: 2px dashed var(--line); padding-bottom: 6px; }
  .muted { color: var(--muted); }
  input, textarea { width: 100%; background: #0a0816; color: var(--ink); border: 0; box-shadow: inset 0 0 0 2px var(--line); padding: 9px 11px; font: 15px "IBM Plex Mono", monospace; border-radius: 0; }
  input:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent2); }
  button { border: 0; cursor: pointer; font: 600 13px "IBM Plex Mono", monospace; letter-spacing: 2px; padding: 9px 14px; background: #241d45; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  button.ok { background: var(--accent2); color: #05211d; box-shadow: none; }
  button.no { color: var(--bad); }
  button.pri { background: var(--accent); color: #1a1203; box-shadow: none; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--panel); padding: 14px 16px; margin: 10px 0; box-shadow: inset 0 0 0 1px var(--line); }
  .card .q { font-size: 18px; font-weight: 600; }
  .card .meta { font-size: 12px; color: var(--muted); margin: 4px 0 10px; }
  .tabs button.on { box-shadow: inset 0 0 0 2px var(--accent); }
  .tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin: 10px 0; }
  .tiers label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .tiers textarea { min-height: 110px; }
  .note { font-size: 13px; color: var(--muted); }
  .msg { color: var(--accent2); min-height: 22px; }
  .rep-img { display: block; max-width: 100%; max-height: 420px; margin: 8px 0; box-shadow: 0 0 0 2px var(--line); cursor: zoom-in; }
  .rep-text { white-space: pre-wrap; word-break: break-word; }
  .card.done { opacity: .55; }
  .miss { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
  .miss input { max-width: 340px; }
  .miss select { background: #0a0816; color: var(--ink); border: 0; box-shadow: inset 0 0 0 2px var(--line); padding: 8px; font: 14px "IBM Plex Mono", monospace; }
  .badge { font-size: 11px; padding: 2px 6px; background: #241d45; margin-left: 6px; }
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
</head>
<body>
<div class="wrap">
  <h1>Szyb · panel autora</h1>
  <p class="muted">Tu trafiają pytania proponowane przez graczy i zgłoszenia błędów. Przyjęte pytanie dopisujesz z odpowiedziami w pokładach i wchodzi do losowania od jutra.</p>

  <div id="login" class="card">
    <div class="row"><input id="key" type="password" placeholder="hasło autora" autocomplete="current-password" style="flex:1;min-width:220px"><button class="pri" id="btnLogin">ZALOGUJ</button></div>
  </div>

  <div id="main" hidden>
    <div class="row tabs"><button data-f="new" class="on">NOWE</button><button data-f="accepted">PRZYJĘTE</button><button data-f="rejected">ODRZUCONE</button><button data-f="reports">ZGŁOSZENIA BŁĘDÓW</button><button data-f="misses">BRAKUJĄCE ODPOWIEDZI</button><button id="btnNew">+ WŁASNE PYTANIE</button><button id="btnLogout" style="margin-left:auto">WYLOGUJ</button></div>
    <p class="msg" id="msg"></p>
    <div id="list"></div>
    <h2>PYTANIA W GRZE (Z PROPOZYCJI)</h2>
    <div id="cats"></div>
  </div>
</div>
<script src="shared/cats.js"></script>
<script src="shared/data.js"></script>
<script src="admin.js"></script>
</body>
</html>
